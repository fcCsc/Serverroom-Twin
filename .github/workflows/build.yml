name: SPFx package

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  package:
    name: Build and package SPFx solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js 18
        uses: actions/setup-node@v5
        with:
          node-version: '18.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build SPFx bundle
        run: npm run build

      - name: Package SPFx solution
        run: npm run package-solution

      - name: Upload SharePoint package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharepoint-sppkg
          path: sharepoint/solution/*.sppkg
          if-no-files-found: error
